example_outputs/flux_schnell/dog_result_2.jpg\"},{\"path\":\"reproduction/third_party/sgi/assets/example_outputs/flux_schnell/dog_result_3.jpg\",\"mode\":\"100644\",\"sha\":\"8a7a6424afbb9aeeab71504b68122392ba9e8d2b\",\"size\":48188,\"binary\":true,\"url\":\"https://raw.githubusercontent.com/GaParmar/group-inference/a1fff209d3796df16d87a7876c5076721ccb1772/assets/example_outputs/flux_schnell/dog_result_3.jpg\"},{\"path\":\"reproduction/third_party/sgi/assets/qualitative_results.jpg\",\"mode\":\"100644\",\"sha\":\"5c24b753e45ad7ba42005c903fe0498712ee9783\",\"size\":2032930,\"binary\":true,\"url\":\"https://raw.githubusercontent.com/GaParmar/group-inference/a1fff209d3796df16d87a7876c5076721ccb1772/assets/qualitative_results.jpg\"},{\"path\":\"reproduction/third_party/sgi/assets/teaser_v2_website.png\",\"mode\":\"100644\",\"sha\":\"1fe7703915c1d0e16109fbb4aee62c5196e7a8a0\",\"size\":8028118,\"binary\":true,\"url\":\"https://raw.githubusercontent.com/GaParmar/group-inference/a1fff209d3796df16d87a7876c5076721ccb1772/assets/teaser_v2_website.png\"}]")
          for asset in assets:
              path = pathlib.Path(asset["path"])
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(asset["url"], headers={"User-Agent": "tts-diffusion-reproduction/1.0"})
                      with urllib.request.urlopen(req, timeout=180) as response:
                          data = response.read()
                      got = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
                      if got != asset["sha"]:
                          raise RuntimeError(f'Hash mismatch: {path}: {got} != {asset["sha"]}')
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(data)
                      print(f'Verified {path} ({len(data)} bytes)', flush=True)
                      break
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(5 * (attempt + 1))
          
          PY
      - name: Commit verified assets and remove this one-time synchronization workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-public-assets.yml
          git add papers reproduction/third_party/sgi/assets
          test "$(git write-tree)" = "4ec8fe28c9fece9d16e90c0d53709035033b9edc"
          git commit -m "Include pinned papers and upstream example assets"
          git push origin HEAD:main
